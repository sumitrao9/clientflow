line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "RUF012",  # Django/DRF mutable class defaults are idiomatic
]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is fine in tests
"*/migrations/*" = ["E501"]  # auto-generated by Django makemigrations
# Idiomatic Django/DRF/reportlab code: list_display, field kwargs, TableStyle tuples
"accounts/admin.py" = ["E501"]
"accounts/serializers.py" = ["E501"]
"projects/admin.py" = ["E501"]
"invoices/admin.py" = ["E501"]
"invoices/models.py" = ["E501"]
"invoices/pdf.py" = ["E501"]
"invoices/tests.py" = ["E501"]
"config/settings.py" = ["E501"]
"config/exceptions.py" = ["E501"]
