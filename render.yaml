services:
  - type: web
    name: clientflow
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: clientflow-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "0"

databases:
  - name: clientflow-db
    plan: free
