name: ClientFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clientflow_test
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: clientflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check .

      - name: Run type check
        run: mypy clientflow/ config/ || echo "Type check skipped"

      - name: Run unit tests
        run: |
          python manage.py test --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          POSTGRES_DB: clientflow_test
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: clientflow
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_DEBUG: 1

  # Live browser tests (if any)
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install Playwright
        run: playwright install --with-deps chromium
      - name: Run live tests
        run: pytest tests/ -v -k "live" --timeout=120
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

  build:
    runs-on: ubuntu-latest
    needs: [test, live-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/sumitrao9/clientflow:latest,ghcr.io/sumitrao9/clientflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
